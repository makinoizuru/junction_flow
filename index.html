<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="交差点の色別ルートと信号サイクルを直接操作するグリッド交通パズル"
    />
    <title>Junction Flow — グリッド交通パズル</title>
    <link rel="stylesheet" href="./styles.css?v=20260729-2" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Junction Flow ホーム">
        <span class="brand-mark" aria-hidden="true">•••</span>
        <span><strong>JUNCTION</strong><small>FLOW</small></span>
      </a>
      <p><span class="status-dot"></span> グリッド交通パズル</p>
    </header>

    <main class="game-shell">
      <aside class="stage-panel" aria-labelledby="stage-heading">
        <div class="eyebrow">STAGE SELECT</div>
        <h2 id="stage-heading">マップを選ぶ</h2>
        <nav id="stage-list" class="stage-list" aria-label="ステージ一覧"></nav>

        <div class="legend">
          <h3>盤面を直接クリック</h3>
          <p><span class="legend-route">↱</span> 色付き矢印：進行方向</p>
          <p><span class="legend-phase">↕</span> 信号スロット：上下</p>
          <p><span class="legend-phase">↔</span> 信号スロット：左右</p>
          <p><span class="legend-exit">EXIT</span> 同じ色の出口がゴール</p>
        </div>
      </aside>

      <section class="play-area" aria-labelledby="stage-title">
        <div class="stage-heading-row">
          <div>
            <div id="stage-kicker" class="eyebrow">STAGE 01</div>
            <h1 id="stage-title">グリッド交差点</h1>
          </div>
          <div class="turn-counter" aria-live="polite">
            <span>TURN</span>
            <strong id="turn-value">00</strong>
          </div>
        </div>

        <p id="stage-instruction" class="stage-instruction"></p>

        <div id="board-frame" class="board-frame">
          <svg
            id="game-board"
            viewBox="0 0 700 700"
            role="img"
            aria-labelledby="board-title board-description"
          ></svg>

          <div id="result-overlay" class="result-overlay" hidden>
            <div class="result-card">
              <div id="result-icon" class="result-icon">✓</div>
              <div id="result-label" class="eyebrow">GRID CLEAR</div>
              <h2 id="result-title">全車、到着！</h2>
              <p id="result-detail"></p>
              <button id="next-button" class="primary-button" type="button">
                次のステージ
              </button>
            </div>
          </div>
        </div>

        <div class="board-toolbar">
          <div class="playback-controls" aria-label="シミュレーション操作">
            <button id="play-button" class="primary-button" type="button">
              ▶ 流してみる
            </button>
            <button id="pause-button" class="secondary-button" type="button" disabled>
              Ⅱ 一時停止
            </button>
            <button id="reset-button" class="secondary-button" type="button">
              ↻ やり直す
            </button>
          </div>
          <p id="status-message" class="status-message" aria-live="polite"></p>
        </div>

        <div class="stage-tip">
          <span>TIP</span>
          <p id="stage-tip"></p>
        </div>
      </section>
    </main>

    <footer>
      <p>Junction Flow × Grid Flow Control</p>
    </footer>

    <script type="module" src="./src/app.js?v=20260729-2"></script>
  </body>
</html>
